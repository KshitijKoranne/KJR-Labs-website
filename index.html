<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KJR Labs | Play Through a Software Studio</title>
  <meta name="description" content="Explore KJR Labs as a playable open-world software studio: websites, Chrome extensions, custom software, apps, automation systems, and project showcases.">
  <meta name="author" content="KJR Labs">
  <link rel="canonical" href="https://kjrlabs.in/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kjrlabs.in/">
  <meta property="og:title" content="KJR Labs | Play Through a Software Studio">
  <meta property="og:description" content="A game-like agency website where clients explore services, projects, process, and contact by walking through a playable world.">
  <meta property="og:image" content="https://kjrlabs.in/images/logo-kjr-labs.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="KJR Labs | Play Through a Software Studio">
  <meta name="twitter:description" content="Websites, Chrome extensions, custom software, apps, automation systems, and product launches as a playable open-world journey.">
  <meta name="twitter:image" content="https://kjrlabs.in/images/logo-kjr-labs.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
  <link rel="shortcut icon" href="images/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="manifest" href="images/site.webmanifest">
  <link rel="stylesheet" href="css/site.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "KJR Labs",
    "url": "https://kjrlabs.in/",
    "logo": "https://kjrlabs.in/images/logo-kjr-labs.png",
    "email": "kjrlabs9@gmail.com",
    "areaServed": "Worldwide",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Vadodara",
      "addressRegion": "Gujarat",
      "addressCountry": "IN"
    },
    "description": "KJR Labs designs and builds websites, Chrome extensions, custom software, web apps, automation systems, and digital products."
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#dialogue">Skip to current dialogue</a>
  <main class="game-shell" aria-label="Playable KJR Labs software studio world">
    <canvas id="world" aria-label="Playable KJR Labs open-world agency map"></canvas>

    <section class="loading-screen" data-loading aria-label="Loading KJR Labs world">
      <div class="loading-card">
        <img src="images/logo-kjr-labs.png" alt="" width="56" height="56">
        <p class="eyebrow">KJR Labs</p>
        <h1>Lighting the idea lantern</h1>
        <div class="loading-bar" aria-hidden="true"><span data-loading-bar></span></div>
        <p data-loading-status>Drawing the first road...</p>
      </div>
    </section>

    <header class="game-topbar">
      <a class="brand" href="#start" aria-label="KJR Labs start camp">
        <img src="images/logo-kjr-labs.png" alt="" width="40" height="40">
        <span>KJR Labs</span>
      </a>
      <div class="topbar-hint">
        <span>Desktop</span>
        <strong>WASD / Arrows</strong>
      </div>
      <div class="topbar-hint mobile-only">
        <span>Mobile</span>
        <strong>Tap road to walk</strong>
      </div>
    </header>

    <aside class="hud" aria-label="Game status">
      <div class="hud-item">
        <span>Area</span>
        <strong data-area>Start Camp</strong>
      </div>
      <div class="hud-item">
        <span>Nearby</span>
        <strong data-nearby>Explore the hub</strong>
      </div>
    </aside>

    <section class="dialogue-card" id="dialogue" data-dialogue hidden aria-live="polite">
      <p class="dialogue-kicker" data-dialogue-kicker>Start Camp</p>
      <h2 data-dialogue-title>KJR Labs</h2>
      <p data-dialogue-copy>Walk the roads. Each place reveals one part of the studio.</p>
      <div class="dialogue-actions" data-dialogue-actions></div>
    </section>

    <div class="tap-marker" data-tap-marker hidden></div>
    <div class="interaction-prompt" data-prompt hidden>Walk closer to interact</div>

    <noscript>
      <section class="noscript-panel">
        <h1>KJR Labs builds websites, Chrome extensions, custom software, apps, and automation systems.</h1>
        <p>This site is a playable world and needs JavaScript to run. Email kjrlabs9@gmail.com to start a build.</p>
      </section>
    </noscript>
  </main>

  <script type="module" src="js/site.js"></script>
</body>
</html>
